    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

font-family: "Cairo", sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #a09f9f 0%,
                    #000000 45%,
                    #000000 100%
                );

            color: #ffffff;

            min-height: 100vh;

        }


        /* =========================
           CONTAINER
        ========================= */

        .container {

            width: 92%;

            max-width: 700px;

            margin: 40px auto;

        }


        /* =========================
           LOGO
        ========================= */

        .logo {

            text-align: center;

            color: #fffefe;

            font-size: 45px;

            font-weight: 700;

            margin-bottom: 25px;

            text-shadow:
                0 5px 20px rgba(255, 255, 255, 0.08);

        }


        /* =========================
           CHECKOUT BOX
        ========================= */

        .checkout-box {

            background: #3838385b;

            color: #fdfdfd;

            padding: 30px;

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.65);

        }


        /* =========================
           TITLE
        ========================= */

        .title {

            text-align: center;

            color: #fdfdfd;

            font-size: 30px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #a5a5a5;

            margin-bottom: 30px;

            font-size: 17px;

        }


        /* =========================
           PRODUCT SUMMARY
        ========================= */

        .product-summary {

            background: #436d4a;

            border: 1px solid #2b2b2b;

            border-radius: 15px;

            padding: 18px;

            margin-bottom: 25px;

            box-shadow:
                inset 0 0 20px rgba(255, 255, 255, 0.015);

        }


        .product-summary-title {

            color: #ffffff;

            font-size: 21px;

            font-weight: 700;

            margin-bottom: 12px;

        }


        .product-summary p {

            font-size: 17px;

            margin: 6px 0;

            color: #dddddd;

        }


        .product-summary strong {

            color: #ffffff;

        }


        /* =========================
           FORM
        ========================= */

        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #ffffff;

            font-size: 18px;

            font-weight: 700;

        }


        input,
        select {

            width: 100%;

            height: 52px;

            padding: 0 15px;

            border: 1px solid #333333;

            border-radius: 12px;

            outline: none;

            font-family: inherit;

            font-size: 16px;

            background: #a8a8a8;

            color: #111111;

            transition: 0.3s;

        }


        input::placeholder {

            color: #777777;

        }


        input:focus,
        select:focus {

            border-color: #fffdfd;

            background: #ffffff;

            color: #111111;

            box-shadow:
                0 0 0 3px rgba(255, 255, 255, 0.12);

        }


        select:disabled {

            opacity: 0.65;

            cursor: not-allowed;

        }


        /* =========================
           ROW
        ========================= */

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }


        /* =========================
           SUBMIT BUTTON
        ========================= */

        .submit-btn {

            width: 100%;

            height: 55px;

            border: 1px solid #ffffff;

            border-radius: 13px;

            background: #f5f5f5;

            color: #000000;

            font-family: inherit;

            font-size: 20px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 10px;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.35);

        }


        .submit-btn:hover {

            background: #000000;

            color: #ffffff;

            border-color: #ffffff;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(255, 255, 255, 0.08);

        }


        .submit-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;

        }


        /* =========================
           LOADING
        ========================= */

        .loading {

            display: none;

            align-items: center;

            justify-content: center;

            gap: 10px;

        }


        .spinner {

            width: 20px;

            height: 20px;

            border: 3px solid rgba(0, 0, 0, 0.25);

            border-top-color: #000000;

            border-radius: 50%;

            animation: spin 0.7s linear infinite;

        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        /* =========================
           BACK LINK
        ========================= */

        .back {

            display: block;

            text-align: center;

            color: #999999;

            text-decoration: none;

            margin-top: 20px;

            font-size: 17px;

            transition:
                color 0.3s ease,
                transform 0.3s ease;

        }


        .back:hover {

            color: #ffffff;

            transform: translateX(-3px);

        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        .success-message {

            display: none;

            text-align: center;

            padding: 25px 10px 15px;

            animation: successAppear 0.5s ease;

        }


        .success-icon {

            width: 100px;

            height: 100px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #007c11;

            color: #f5f4f4;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 55px;

            font-weight: bold;

            border: 3px solid #ffffff;

            box-shadow:
                0 10px 35px rgba(255, 255, 255, 0.08);

            animation: iconPop 0.6s ease;

        }


        .success-message h2 {

            color: #f7f7f7;

            font-size: 32px;

            margin-bottom: 10px;

        }


        .success-message p {

            color: #999999;

            font-size: 18px;

            line-height: 1.8;

            margin-bottom: 25px;

        }


        .success-home {

            display: inline-block;

            background: #ffffff;

            color: #000000;

            text-decoration: none;

            padding: 13px 30px;

            border-radius: 12px;

            border: 1px solid #ffffff;

            font-size: 18px;

            font-weight: 700;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                transform 0.3s ease;

        }


        .success-home:hover {

            background: #000000;

            color: #ffffff;

            transform: translateY(-2px);

        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error-message {

            display: none;

            background: #160707;

            color: #ffb4b4;

            border: 1px solid #4a1818;

            border-radius: 12px;

            padding: 12px 15px;

            margin-top: 15px;

            text-align: center;

            font-size: 16px;

        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes successAppear {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        @keyframes iconPop {

            0% {

                opacity: 0;

                transform: scale(0.4);

            }

            70% {

                transform: scale(1.1);

            }

            100% {

                opacity: 1;

                transform: scale(1);

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {

                width: 94%;

                margin: 20px auto;

            }


            .checkout-box {

                padding: 20px;

            }


            .logo {

            }


            .title {

                font-size: 26px;

            }


            .row {

                grid-template-columns: 1fr;

                gap: 0;

            }


            .success-message h2 {

                font-size: 27px;

            }


            .success-icon {

                width: 85px;

                height: 85px;

                font-size: 45px;

            }

        }

    </style>

</head>

        /* =========================================
           تغيير المحافظة
        ========================================= */

        governorateSelect.addEventListener(
            "change",
            function () {

                const governorate =
                    this.value;

                citySelect.innerHTML = "";

                citySelect.disabled = true;


                if (!governorate) {

                    citySelect.innerHTML = `
                        <option value="">
                            اختر المحافظة أولًا
                        </option>
                    `;

                    return;
                }


                const cities =
                    citiesByGovernorate[governorate] || [];


                citySelect.innerHTML = `
                    <option value="">
                        اختر المدينة / المركز
                    </option>
                `;


                cities.forEach(function (city) {

                    const option =
                        document.createElement("option");

                    option.value = city;

                    option.textContent = city;

                    citySelect.appendChild(option);

                });


                citySelect.disabled = false;

            }
        );


        /* =========================================
           السماح بالأرقام فقط
        ========================================= */

        function allowOnlyNumbers(input) {

            input.addEventListener(
                "input",
                function () {

                    this.value =
                        this.value
                        .replace(/\D/g, "")
                        .slice(0, 11);

                }
            );

        }


        allowOnlyNumbers(whatsappInput);

        allowOnlyNumbers(phoneInput);


        /* =========================================
           جلب بيانات المنتج
        ========================================= */

        let checkoutProduct = null;


        try {

            const savedProduct =
                localStorage.getItem(
                    "checkoutProduct"
                );

            if (savedProduct) {

                checkoutProduct =
                    JSON.parse(savedProduct);

            }

        } catch (error) {

            console.error(
                "Product data error:",
                error
            );

            checkoutProduct = null;

        }


        /* =========================================
           عرض بيانات المنتج
        ========================================= */

        if (checkoutProduct) {

            const productName =
                checkoutProduct.name ||
                "غير محدد";

            const productPrice =
                checkoutProduct.price ||
                "غير محدد";

            const productColor =
                checkoutProduct.color ||
                "غير محدد";

            const productSize =
                checkoutProduct.size ||
                "غير محدد";

            const productQuantity =
                checkoutProduct.quantity ||
                1;

            const productImage =
                checkoutProduct.image ||
                "";


            /* =========================
               عرض للعميل
            ========================= */

            document.getElementById(
                "showProductName"
            ).textContent =
                productName;


            document.getElementById(
                "showProductPrice"
            ).textContent =
                productPrice;


            document.getElementById(
                "showProductColor"
            ).textContent =
                productColor;


            document.getElementById(
                "showProductSize"
            ).textContent =
                productSize;


            document.getElementById(
                "showProductQuantity"
            ).textContent =
                productQuantity;


            /* =========================
               بيانات الإيميل
            ========================= */

            document.getElementById(
                "emailProductName"
            ).value =
                productName;


            document.getElementById(
                "emailProductPrice"
            ).value =
                productPrice;


            document.getElementById(
                "emailProductColor"
            ).value =
                productColor;


            document.getElementById(
                "emailProductSize"
            ).value =
                productSize;


            document.getElementById(
                "emailProductQuantity"
            ).value =
                productQuantity;


            document.getElementById(
                "emailProductImage"
            ).value =
                productImage;


            /* =========================
               تفاصيل الطلب
            ========================= */

            document.getElementById(
                "emailOrderDetails"
            ).value =

                "🛍️ تفاصيل المنتج\n\n" +

                "اسم المنتج: " +
                productName +

                "\n" +

                "السعر: " +
                productPrice +

                "\n" +

                "اللون: " +
                productColor +

                "\n" +

                "المقاس: " +
                productSize +

                "\n" +

                "الكمية: " +
                productQuantity;

        }


        /* =========================================
           لو مفيش منتج
        ========================================= */

        else {

            document.getElementById(
                "showProductName"
            ).textContent =
                "لم يتم العثور على المنتج";

            document.getElementById(
                "showProductPrice"
            ).textContent =

            document.getElementById(
                "showProductColor"
            ).textContent =

                "showProductQuantity"

        }


        /* =========================================
           إرسال الطلب
        ========================================= */

        orderForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                /* إخفاء رسالة الخطأ */

                errorMessage.style.display =
                    "none";


                /* منع الضغط مرتين */

                submitBtn.disabled =
                    true;

                buttonText.style.display =
                    "none";

                loading.style.display =
                    "flex";


                /* =================================
                   قراءة البيانات
                ================================= */

                const name =
                    nameInput.value.trim();

                const governorate =
                    governorateSelect.value;

                const city =
                    citySelect.value;

                const street =
                    document.getElementById(
                        "street"
                    ).value.trim();

                const whatsapp =
                    whatsappInput.value.trim();

                const phone =
                    phoneInput.value.trim();


                /* =================================
                   التحقق من الاسم
                ================================= */

                const nameParts =
                    name
                        .split(/\s+/)
                        .filter(Boolean);


                if (nameParts.length < 3) {

                    errorMessage.textContent =
                        "من فضلك اكتب الاسم ثلاثي على الأقل.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    nameInput.focus();

                    return;

                }


                /* =================================
                   التحقق من أرقام الهاتف
                ================================= */

                const egyptianPhoneRegex =
                    /^01[0125][0-9]{8}$/;


                if (
                    !egyptianPhoneRegex.test(phone)
                ) {

                    errorMessage.textContent =
                        "رقم الهاتف يجب أن يكون 11 رقمًا ويبدأ بـ 010 أو 011 أو 012 أو 015.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    phoneInput.focus();

                    return;

                }


                if (
                    !egyptianPhoneRegex.test(whatsapp)
                ) {

                    errorMessage.textContent =
                        "رقم الواتساب يجب أن يكون 11 رقمًا ويبدأ بـ 010 أو 011 أو 012 أو 015.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    whatsappInput.focus();

                    return;

                }


                /* =================================
                   التحقق من العنوان
                ================================= */

                if (!governorate) {

                    errorMessage.textContent =
                        "من فضلك اختر المحافظة.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    governorateSelect.focus();

                    return;

                }


                if (!city) {

                    errorMessage.textContent =
                        "من فضلك اختر المدينة أو المركز.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    citySelect.focus();

                    return;

                }


                if (!street) {

                    errorMessage.textContent =
                        "من فضلك اكتب العنوان بالتفصيل.";

                    errorMessage.style.display =
                        "block";

                    resetSubmitButton();

                    document.getElementById(
                        "street"
                    ).focus();

                    return;

                }


                /* =================================
                   التاريخ والوقت
                ================================= */

                const orderDate =
                    new Date()
                        .toLocaleString("ar-EG");


                /* =================================
                   إضافة التاريخ للتفاصيل
                ================================= */

                document.getElementById(
                    "emailOrderDetails"
                ).value +=

                    "\n\n" +

                    "📍 المحافظة: " +
                    governorate +

                    "\n" +

                    "🏙️ المدينة / المركز: " +
                    city +

                    "\n" +

                    "📅 تاريخ الطلب: " +
                    orderDate;


                /* =================================
                   حفظ نسخة محلية
                ================================= */

                const orderData = {

                    customer: {

                        name:
                            name,

                        governorate:
                            governorate,

                        city:
                            city,

                        street:
                            street,

                        whatsapp:
                            whatsapp,

                        phone:
                            phone

                    },

                    product:
                        checkoutProduct,

                    date:
                        orderDate

                };


                localStorage.setItem(

                    "customerOrderData",

                    JSON.stringify(orderData)

                );


                /* =================================
                   إرسال Formspree
                ================================= */

                try {

                    const response =
                        await fetch(

                            orderForm.action,

                            {

                                method:
                                    "POST",

                                body:
                                    new FormData(
                                        orderForm
                                    ),

                                headers: {

                                    "Accept":
                                        "application/json"

                                }

                            }

                        );


                    /* =================================
                       نجاح
                    ================================= */

                    if (response.ok) {

                        checkoutContent.style.display =
                            "none";

                        backLink.style.display =
                            "none";

                        successMessage.style.display =
                            "block";


                        /* حذف المنتج بعد نجاح الطلب */

                        localStorage.removeItem(
                            "checkoutProduct"
                        );

                    }


                    /* =================================
                       فشل
                    ================================= */

                    else {

                        throw new Error(
                            "Formspree request failed"
                        );

                    }

                }


                catch (error) {

                    console.error(
                        "Order Error:",
                        error
                    );


                    errorMessage.textContent =
                        "تعذر إرسال الطلب. تأكد من اتصال الإنترنت وحاول مرة أخرى.";


                    errorMessage.style.display =
                        "block";


                    resetSubmitButton();

                }

            }
        );


        /* =========================================
           إعادة زر الطلب لحالته الطبيعية
        ========================================= */

        function resetSubmitButton() {

            submitBtn.disabled =
                false;

            buttonText.style.display =
                "inline";

            loading.style.display =
                "none";

        }

    </script>
